{% comment %}
The one note the site leaves for the reader. Every public page includes this
once, inside <body>, and links css/banner.css.
{% endcomment %}
{% if messages %}
    <div class="messages" id="message-banner" role="status">
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    </div>

    <script>
        (function () {
            const note = document.getElementById('message-banner');
            if (!note) return;

            // Touching the note takes it away early; otherwise it leaves on its
            // own. Removing it rather than hiding it keeps the fixed layer from
            // sitting over the page once it has faded.
            let leaving = false;
            function dismiss() {
                if (leaving) return;
                leaving = true;
                note.addEventListener('transitionend', () => note.remove(), { once: true });
                note.classList.add('leaving');
                // Belt and braces for the case where no transition runs at all.
                setTimeout(() => note.remove(), 700);
            }

            note.addEventListener('click', dismiss);
            setTimeout(dismiss, 2500);
        })();
    </script>
{% endif %}
