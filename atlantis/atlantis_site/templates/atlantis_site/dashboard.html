{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlantis</title>
    {% include '_favicon.html' %}
    <style>
        @font-face {
            font-family: "Atlantis Hand";
            src: url("{% static 'atlantis_site/assets/fonts/atlantishand.ttf' %}") format("truetype");
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1b7fc4;
            font-family: "Atlantis Hand", sans-serif;
        }

        #scene {
            position: fixed;
            left: 50%;
            bottom: 0;
            translate: -50% 0;
            aspect-ratio: 2500 / 1462;
            width: 100vw;
            min-width: calc(100vh * 2500 / 1462);
            min-width: calc(100dvh * 2500 / 1462);
        }

        @media (max-aspect-ratio: 6 / 5) {
            #scene {
                min-width: 0;
                bottom: 50%;
                translate: -50% 50%;
            }

            #backdrop {
                position: fixed;
                inset: 0;
                background: url("{% static 'atlantis_site/assets/img/dashboard/background.png' %}") center / cover;
                filter: blur(28px) brightness(0.8);
                scale: 1.1;
            }
        }

        #scene-bg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .scene-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #chest-art {
            transform-origin: 27.26% 79.92%;
        }

        #telescope-art {
            transform-origin: 84.78% 58.55%;
        }

        .item {
            position: relative;
            width: var(--w);
            rotate: var(--tilt, 0deg);
            transition: scale 0.15s ease-out;
        }

        .item img,
        .scene-art {
            filter: drop-shadow(0 0 0.32vw rgba(255, 244, 199, 0.8));
            transition: filter 0.15s ease-out, scale 0.15s ease-out;
        }

        .item img {
            display: block;
            position: absolute;
            left: calc(var(--art-x) * -100%);
            top: calc(var(--art-y) * -100%);
            width: calc(var(--art) * 100%);
            height: auto;
            pointer-events: none;
        }

        #dock {
            --u: clamp(40px, min(5.6vw, 10vh), 108px);
            position: fixed;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 0.38);
            padding: calc(var(--u) * 0.32) calc(var(--u) * 0.4);
            border-radius: calc(var(--u) * 0.35) 0 0 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.34), rgba(196, 233, 255, 0.14));
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            -webkit-backdrop-filter: blur(3px) saturate(1.15) brightness(1.05);
            backdrop-filter: blur(3px) saturate(1.15) brightness(1.05);
            box-shadow: 0 0 1.6vw rgba(0, 30, 56, 0.22);
        }

        #item-scroll {
            --w: calc(var(--u) * 0.9);
            --art: 1.86013; --art-x: 0.51135; --art-y: 0.23483;
            aspect-ratio: 1101 / 1533;
        }

        #item-scroll img {
            transform: scaleX(-1);
        }

        #item-map {
            --w: calc(var(--u) * 1.9);
            --art: 1.50257; --art-x: 0.28100; --art-y: 0.48234;
            aspect-ratio: 1363 / 1161;
        }

        #item-book {
            --w: calc(var(--u) * 2);
            --art: 1.99028; --art-x: 0.35277; --art-y: 0.89691;
            aspect-ratio: 1029 / 776;
        }

        #item-chest {
            position: absolute;
            left: 18.96%;
            top: 63.95%;
            --w: 16.60%;
            height: 31.94%;
        }

        #item-telescope {
            position: absolute;
            left: 77.64%;
            top: 46.72%;
            --w: 14.28%;
            height: 23.67%;
        }

        .item:hover img,
        .item:focus-visible img,
        #item-chest:hover ~ #chest-art,
        #item-chest:focus-visible ~ #chest-art,
        #item-telescope:hover ~ #telescope-art,
        #item-telescope:focus-visible ~ #telescope-art {
            filter: brightness(1.08) drop-shadow(0 0 0.7vw rgba(255, 244, 199, 0.95));
        }

        .item:hover,
        .item:focus-visible,
        #item-chest:hover ~ #chest-art,
        #item-chest:focus-visible ~ #chest-art,
        #item-telescope:hover ~ #telescope-art,
        #item-telescope:focus-visible ~ #telescope-art {
            scale: 1.04;
        }

        .item-label-frame {
            position: absolute;
            inset: 0;
            rotate: calc(-1 * var(--tilt, 0deg));
            pointer-events: none;
        }

        .item-label {
            position: absolute;
            left: var(--label-x, 50%);
            bottom: var(--label-y, 100%);
            translate: -50% 0;
            margin-bottom: 0.4em;
            padding: 0.05em 0.6em 0.15em;
            border-radius: 0.6em;
            background-color: rgba(0, 46, 79, 0.72);
            color: #E5F2FC;
            font-size: clamp(15px, 1.35vw, 26px);
            line-height: 1.35;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }

        .item:hover .item-label,
        .item:focus-visible .item-label {
            opacity: 1;
        }

        @media (hover: none) {
            .item-label {
                opacity: 1;
            }
        }

        .hud {
            position: fixed;
            top: clamp(12px, 2.2vh, 34px);
            display: flex;
            align-items: center;
            gap: clamp(8px, 0.85vw, 18px);
            color: #FFFFFF;
            text-shadow: 0 0.06em 0.25em rgba(0, 46, 79, 0.55);
        }

        #hud-profile {
            left: clamp(12px, 1.6vw, 34px);
            text-decoration: none;
            opacity: 0.55;
            transition: opacity 0.15s ease-out;
        }

        #hud-profile:hover,
        #hud-profile:focus-visible {
            opacity: 1;
        }

        #hud-profile img {
            display: block;
            width: clamp(44px, 5.4vw, 104px);
            height: clamp(44px, 5.4vw, 104px);
            border-radius: 0.35em;
            object-fit: cover;
            background-color: rgba(0, 46, 79, 0.25);
        }

        #hud-name {
            font-size: clamp(20px, 2.35vw, 46px);
            line-height: 1.1;
        }

        #hud-email {
            font-size: clamp(14px, 1.55vw, 30px);
            line-height: 1.1;
            word-break: break-all;
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }

        #hud-profile:hover #hud-email,
        #hud-profile:focus-visible #hud-email {
            opacity: 0.92;
        }

        #hud-counters {
            right: clamp(12px, 1.6vw, 34px);
            gap: clamp(4px, 0.5vw, 12px);
            font-size: clamp(22px, 2.5vw, 48px);
        }

        #hud-pearl {
            position: relative;
            width: clamp(30px, 3.3vw, 64px);
            aspect-ratio: 1;
            overflow: hidden;
        }

        #hud-pearl img {
            position: absolute;
            left: -55.541%;
            top: -61.082%;
            width: 270.185%;
        }
    </style>
</head>
<body>
    <div id="backdrop" aria-hidden="true"></div>

    <div id="scene">
        <img id="scene-bg" src="{% static 'atlantis_site/assets/img/dashboard/background.png' %}" alt="The bow of a boat at sea, carrying a treasure chest and a telescope.">

        <a class="item" id="item-chest" href="{% url 'shop' %}" aria-label="Shop">
            <span class="item-label-frame"><span class="item-label">shop</span></span>
        </a>
        <img class="scene-art" id="chest-art" src="{% static 'atlantis_site/assets/img/dashboard/chest.png' %}" alt="">

        <a class="item" id="item-telescope" href="{% url 'explore' %}" aria-label="Explore">
            <span class="item-label-frame"><span class="item-label">explore</span></span>
        </a>
        <img class="scene-art" id="telescope-art" src="{% static 'atlantis_site/assets/img/dashboard/telescope.png' %}" alt="">
    </div>

    <nav id="dock" aria-label="Ship's locker">
        <a class="item" id="item-scroll" href="{% url 'guides' %}" aria-label="Guides">
            <img src="{% static 'atlantis_site/assets/img/dashboard/scroll.png' %}" alt="">
            <span class="item-label-frame"><span class="item-label">guides/faq</span></span>
        </a>

        <a class="item" id="item-map" href="{% url 'printer_select' %}" aria-label="Pick your printer">
            <img src="{% static 'atlantis_site/assets/img/dashboard/map.png' %}" alt="">
            <span class="item-label-frame"><span class="item-label">printer</span></span>
        </a>

        <a class="item" id="item-book" href="{% url 'projects' %}" aria-label="Projects">
            <img src="{% static 'atlantis_site/assets/img/dashboard/book.png' %}" alt="">
            <span class="item-label-frame"><span class="item-label">projects</span></span>
        </a>
    </nav>

    <a class="hud" id="hud-profile" href="{% url 'user_profile' user.id %}">
        <img src="{{ profile.slack_pfp_url }}" alt="">
        <div>
            <div id="hud-name">{{ profile.slack_username }}</div>
            <div id="hud-email">{{ user.email }}</div>
        </div>
    </a>

    <div class="hud" id="hud-counters" title="{{ profile.layers }} pearls">
        <span id="hud-pearl">
            <img src="{% static 'atlantis_site/assets/img/dashboard/pearl.png' %}" alt="Pearls:">
        </span>
        <span>{{ profile.layers }}</span>
    </div>
</body>
</html>
