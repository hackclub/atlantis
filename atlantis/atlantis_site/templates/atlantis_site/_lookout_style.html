{% comment %}
The recorder popup, dressed for the book: the same markup the recorder JS
drives, in paper and ink instead of the admin palette.
{% endcomment %}
    <style>
        .slip--recorder {
            width: min(94vw, 880px);
        }

        .recorder-head {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .recorder-head h2 {
            margin: 0;
        }

        .tl-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0.05em 0.7em 0.15em;
            border: 0.06em solid #A98F5E;
            border-radius: 999px;
            color: var(--ink-soft);
            font-size: clamp(14px, 1.1vw, 18px);
            white-space: nowrap;
        }

        .tl-pill--live,
        .tl-pill--error {
            border-color: var(--ink-danger);
            color: var(--ink-danger);
        }

        .tl-pill--paused,
        .tl-pill--warn {
            border-color: #9A6300;
            color: #9A6300;
        }

        .tl-pill--processing {
            border-color: var(--ink-link);
            color: var(--ink-link);
        }

        .tl-pill--done {
            border-color: #4B6B2A;
            color: #4B6B2A;
        }

        .tl-dot {
            width: 0.5em;
            height: 0.5em;
            border-radius: 50%;
            background-color: currentColor;
            flex: none;
        }

        .tl-pill--live .tl-dot,
        .stage-badge .tl-dot {
            animation: tl-blink 1.4s ease-in-out infinite;
        }

        @keyframes tl-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        .recorder-hint {
            /* Held at two lines so the buttons below don't jump every time the
               state changes under them. */
            min-height: 2.6em;
            color: var(--ink-soft);
        }

        .recorder-alert {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            padding: 8px 12px 10px;
            border: 0.09em solid var(--ink-danger);
            border-radius: 10px;
            background-color: rgba(163, 60, 43, 0.08);
            color: var(--ink-danger);
            font-size: clamp(15px, 1.25vw, 19px);
        }

        /* The display rules below would beat the UA's [hidden] on their own, so
           each one that the recorder toggles says so itself. */
        .recorder-alert[hidden],
        .stage-badge[hidden],
        .recorder-stage video[hidden] {
            display: none;
        }

        .recorder-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: 14px;
            align-items: start;
        }

        .recorder-stage {
            position: relative;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 0.09em solid var(--paper-edge);
            border-radius: 10px;
            background-color: #241A0C;
        }

        /* Absolutely positioned so the video's intrinsic size can never push
           the box around — the aspect-ratio above is the only thing sizing it. */
        .recorder-stage video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .stage-empty {
            margin: 0;
            padding: 20px;
            max-width: 36ch;
            text-align: center;
            color: #C4B08A;
            font-size: clamp(15px, 1.25vw, 19px);
        }

        .stage-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px 4px;
            border-radius: 999px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #E4917F;
            font-size: clamp(13px, 1vw, 16px);
        }

        .stage-flash {
            position: absolute;
            inset: 0;
            background-color: #FFF;
            opacity: 0;
            pointer-events: none;
        }

        .stage-flash.is-flashing {
            animation: tl-flash 500ms ease-out;
        }

        @keyframes tl-flash {
            0% { opacity: 0.55; }
            100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tl-dot { animation: none !important; }
            .stage-flash.is-flashing { animation: none; }
        }

        .recorder-side {
            display: grid;
            gap: 10px;
            align-content: start;
        }

        .tl-stat {
            padding: 8px 12px 10px;
            border: 0.09em solid var(--paper-edge);
            border-radius: 10px;
            background-color: rgba(255, 253, 247, 0.5);
        }

        .tl-stat-value {
            font-size: clamp(24px, 2vw, 32px);
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .tl-stat-label {
            margin-top: 2px;
            font-size: clamp(15px, 1.2vw, 19px);
        }

        .tl-stat-sub {
            color: var(--ink-soft);
            font-size: clamp(13px, 1.05vw, 17px);
        }

        .recorder-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .tl-btn {
            padding: 0.14em 0.9em 0.26em;
            border: 0.07em solid #9C7F4F;
            border-radius: 999px;
            background-color: rgba(255, 251, 240, 0.55);
            color: var(--ink);
            font-size: clamp(16px, 1.3vw, 20px);
            cursor: pointer;
            transition: background-color 0.15s ease-out, color 0.15s ease-out;
        }

        .tl-btn:hover:not(:disabled),
        .tl-btn:focus-visible:not(:disabled) {
            background-color: #FFFBF0;
        }

        .tl-btn:disabled {
            border-color: #BCA986;
            color: var(--ink-faint);
            cursor: not-allowed;
        }

        .tl-btn--primary {
            border-color: #6B4A24;
            background-color: #6B4A24;
            color: #FBEFD6;
        }

        .tl-btn--primary:hover:not(:disabled),
        .tl-btn--primary:focus-visible:not(:disabled) {
            background-color: #55391A;
            color: #FBEFD6;
        }

        .tl-btn--danger {
            border-color: var(--ink-danger);
            color: var(--ink-danger);
        }

        .tl-btn--danger:hover:not(:disabled),
        .tl-btn--danger:focus-visible:not(:disabled) {
            background-color: var(--ink-danger);
            color: #FFF3F1;
        }

        .tl-btn--ghost {
            border: none;
            background: none;
            color: inherit;
            text-decoration: underline;
            padding: 0;
        }

        .recorder-result {
            margin-top: 16px;
            padding: 12px 14px 14px;
            border: 0.09em solid #8AA36B;
            border-radius: 10px;
            background-color: rgba(255, 253, 247, 0.6);
        }

        .recorder-result h3 {
            margin: 0 0 8px;
            font-weight: 400;
            font-size: clamp(19px, 1.6vw, 25px);
        }

        .recorder-result video {
            display: block;
            max-width: 100%;
            max-height: 360px;
            border-radius: 8px;
        }

        .recorder-next {
            margin: 10px 0 0;
        }

        .recorder-next a {
            color: var(--ink-link);
        }

        .recorder-facts {
            margin: 16px 0 0;
            padding-left: 18px;
            color: var(--ink-soft);
            font-size: clamp(14px, 1.15vw, 18px);
            line-height: 1.5;
        }

        .recorder-log {
            margin-top: 12px;
            color: var(--ink-soft);
            font-size: clamp(14px, 1.15vw, 18px);
        }

        .recorder-log summary {
            cursor: pointer;
        }

        .recorder-log #lookout-log {
            margin-top: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            border: 0.09em solid var(--paper-edge);
            border-radius: 8px;
            background-color: rgba(255, 253, 247, 0.6);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            line-height: 1.5;
            color: var(--ink);
        }

        .lookout-log-warn { color: #9A6300; }
        .lookout-log-error { color: var(--ink-danger); }

        @media (max-width: 780px) {
            .recorder-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
