{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlantis</title>
    <link rel="stylesheet" href="{% static 'atlantis_site/style.css' %}">
    {% include '_favicon.html' %}
    <style>
        @font-face {
            font-family: "Waterlily";
            src: url("{% static 'atlantis_site/assets/fonts/waterlily.ttf' %}") format("truetype");
        }

        @font-face {
            font-family: "Atlantis Hand";
            src: url("{% static 'atlantis_site/assets/fonts/atlantishand.ttf' %}") format("truetype");
        }

        body {
            position: relative;
        }

        #parallax {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            background-color: #1b7fc4;
        }

        .parallax-layer {
            position: absolute;
            inset: 0;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center bottom;
            transform: scale(calc(-1 * var(--scale)), var(--scale));
            will-change: transform;
        }

        #layer-background {
            --scale: 1.06;
            background-image: url("{% static 'atlantis_site/assets/img/landing/background.png' %}");
        }

        #layer-middleground {
            --scale: 1.10;
            background-image: url("{% static 'atlantis_site/assets/img/landing/middleground.png' %}");
        }

        #layer-foreground {
            --scale: 1.20;
            background-image: url("{% static 'atlantis_site/assets/img/landing/foreground.png' %}");
        }

        #landing-title {
            font-family: "Waterlily";
            font-size: clamp(52px, min(12.2vw, 19.5vh), 175px) !important;
            font-weight: 300;
            color: #E5F2FC;
            margin: 0;
            line-height: 1.1;
        }

        #landing-text {
            font-family: "Atlantis Hand";
            color: #E5F2FC;
            font-size: clamp(19px, min(3.15vw, 5vh), 45px);
            line-height: 1.25;
            margin: 0;
            margin-bottom: clamp(14px, 3.3vh, 30px);
        }

        #rsvp-button {
            --border-thin: 0.1em;
            --border-thick: 0.28em;

            display: inline-block;
            box-sizing: border-box;
            font-family: "Atlantis Hand";
            font-size: clamp(23px, min(3.5vw, 5.6vh), 50px);
            color: #00528c;
            text-decoration: none;

            padding: 0.2em 1.2em;
            border-radius: 1em;
            background-color: #E5F2FC;

            border: var(--border-thin) solid #00528c;
            border-bottom-width: var(--border-thick);
            transition: border-bottom-width 0.03s ease-out, transform 0.03s ease-out;
        }

        #rsvp-button:active {
            border-bottom-width: var(--border-thin);
            transform: translateY(calc(var(--border-thick) - var(--border-thin)));
        }

        .content {
            padding: 0;
        }

        .landing {
            text-align: left;
            padding-top: clamp(32px, 15vh, 135px);
            padding-left: clamp(22px, 11.1vw, 160px);
            padding-right: clamp(22px, 6vw, 80px);
            padding-bottom: clamp(24px, 6vh, 60px);
        }
    </style>
</head>
<body>
    <div id="parallax" aria-hidden="true">
        <div class="parallax-layer" id="layer-background" data-depth="7"></div>
        <div class="parallax-layer" id="layer-middleground" data-depth="18"></div>
        <div class="parallax-layer" id="layer-foreground" data-depth="66"></div>
    </div>

    <div class="content">
        <div class="landing">
            <p id="landing-title">Atlantis</p>
            <p id="landing-text">ship 5 hours of CAD a week, <br> get a free 3D printer!</p>
            <a href="https://forms.hackclub.com/atlantis-rsvp" id="rsvp-button">RSVP</a>
        </div>

    </div>

    <script>
        (function () {
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
            const layers = Array.from(document.querySelectorAll(".parallax-layer")).map((el) => ({
                el: el,
                depth: parseFloat(el.dataset.depth),
                scale: parseFloat(getComputedStyle(el).getPropertyValue("--scale")),
                travelX: 0,
                travelY: 0,
            }));

            const REFERENCE_WIDTH = 1440;

            function measure() {
                const k = Math.min(1.6, Math.max(0.55, window.innerWidth / REFERENCE_WIDTH));
                for (const layer of layers) {
                    const depth = layer.depth * k;
                    const bleedX = ((layer.scale - 1) / 2) * window.innerWidth;
                    const bleedY = ((layer.scale - 1) / 2) * window.innerHeight;
                    layer.travelX = Math.min(depth, bleedX);
                    layer.travelY = Math.min(depth * 0.5, bleedY);
                }
            }

            let targetX = 0, targetY = 0, currentX = 0, currentY = 0, frame = null;

            function render() {
                currentX += (targetX - currentX) * 0.075;
                currentY += (targetY - currentY) * 0.075;

                for (const layer of layers) {
                    const x = (-currentX * layer.travelX).toFixed(2);
                    const y = (-currentY * layer.travelY).toFixed(2);
                    layer.el.style.transform =
                        "translate3d(" + x + "px, " + y + "px, 0) " +
                        "scale(" + -layer.scale + ", " + layer.scale + ")";
                }

                if (Math.abs(targetX - currentX) < 0.0005 && Math.abs(targetY - currentY) < 0.0005) {
                    currentX = targetX;
                    currentY = targetY;
                    frame = null;
                    return;
                }
                frame = requestAnimationFrame(render);
            }

            function wake() {
                if (frame === null) frame = requestAnimationFrame(render);
            }

            function onPointerMove(event) {
                targetX = (event.clientX / window.innerWidth) * 2 - 1;
                targetY = (event.clientY / window.innerHeight) * 2 - 1;
                wake();
            }

            function enable() {
                measure();
                window.addEventListener("pointermove", onPointerMove, { passive: true });
                window.addEventListener("pointerleave", recentre, { passive: true });
                wake();
            }

            function recentre() {
                targetX = 0;
                targetY = 0;
                wake();
            }

            function disable() {
                window.removeEventListener("pointermove", onPointerMove);
                window.removeEventListener("pointerleave", recentre);
                if (frame !== null) {
                    cancelAnimationFrame(frame);
                    frame = null;
                }
                targetX = targetY = currentX = currentY = 0;
                for (const layer of layers) layer.el.style.transform = "";
            }

            window.addEventListener("resize", function () {
                measure();
                wake();
            }, { passive: true });

            if (!reduceMotion.matches) enable();
            reduceMotion.addEventListener("change", function (event) {
                if (event.matches) disable();
                else enable();
            });
        })();
    </script>
</body>
</html>
