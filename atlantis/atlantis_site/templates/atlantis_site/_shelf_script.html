{% comment %}
Paging the shelf three books at a time. Reads --per-page back out of the
stylesheet, so the grouping and the sizing can never disagree.
{% endcomment %}
    <script>
        /* ---------- the deck ----------
           The shelf holds one row of books at a time, centred in the window.
           The scrolling itself is the browser's: #shelf is a real scroll
           container with mandatory snap points, so a flick carries its own
           momentum and settles on a shelf. This script only groups the books
           into shelves, keeps the dots in step with wherever the scroll ended
           up, and lets the keys and the dots jump between shelves. */
        (function () {
            const deck = document.getElementById("deck");
            const shelf = document.getElementById("shelf");
            const dots = document.getElementById("deckDots");
            if (!deck || !shelf) return;

            const items = Array.from(shelf.children);
            if (!items.length) return;

            /* Beyond this many shelves the dot column gets a count instead. */
            const MAX_DOTS = 12;

            const stillness = window.matchMedia("(prefers-reduced-motion: reduce)");

            let pages = [];
            let perPage = 0;
            let page = -1;
            let counter = null;
            let counted = false;

            function wantedPerPage() {
                const n = parseInt(getComputedStyle(shelf).getPropertyValue("--per-page"), 10);
                return n > 0 ? n : 3;
            }

            function build(anchorItem) {
                perPage = wantedPerPage();
                const frag = document.createDocumentFragment();
                for (let i = 0; i < items.length; i += perPage) {
                    const sheet = document.createElement("div");
                    sheet.className = "shelf-page";
                    sheet.append(...items.slice(i, i + perPage));
                    frag.append(sheet);
                }
                shelf.replaceChildren(frag);
                pages = Array.from(shelf.children);

                dots.replaceChildren();
                counter = null;
                counted = pages.length > MAX_DOTS;
                if (counted) {
                    counter = document.createElement("p");
                    counter.className = "deck-count";
                    dots.append(counter);
                } else if (pages.length > 1) {
                    pages.forEach((_, i) => {
                        const dot = document.createElement("button");
                        dot.type = "button";
                        dot.className = "deck-dot";
                        dot.setAttribute("aria-label", "Shelf " + (i + 1) + " of " + pages.length);
                        dot.addEventListener("click", () => go(i));
                        dots.append(dot);
                    });
                }
                document.body.classList.toggle("deck-paged", pages.length > 1);
                document.body.classList.toggle("deck-counted", counted);

                // Keep whichever books were on screen on screen.
                page = -1;
                go(Math.floor((anchorItem || 0) / perPage), true);
                settle();
            }

            function pageHeight() {
                return shelf.clientHeight || 1;
            }

            function clamp(n) {
                return Math.max(0, Math.min(pages.length - 1, n));
            }

            /* A jump, for the dots and the keys. A gesture never comes through
               here: the browser scrolls itself. */
            function go(n, instant) {
                shelf.scrollTo({
                    top: clamp(n) * pageHeight(),
                    behavior: instant || stillness.matches ? "auto" : "smooth"
                });
            }

            /* Whatever shelf the scroll is nearest to is the one we are on. */
            function settle() {
                const n = clamp(Math.round(shelf.scrollTop / pageHeight()));
                if (n === page) return;
                page = n;

                pages.forEach((sheet, i) => {
                    const on = i === page;
                    sheet.toggleAttribute("inert", !on);
                    sheet.setAttribute("aria-hidden", on ? "false" : "true");
                });
                if (counter) {
                    counter.textContent = (page + 1) + " / " + pages.length;
                } else {
                    Array.from(dots.children).forEach((dot, i) => {
                        dot.setAttribute("aria-current", i === page ? "true" : "false");
                    });
                }
                document.body.classList.toggle("deck-end", page === pages.length - 1);
            }

            let frame = 0;
            shelf.addEventListener("scroll", () => {
                if (frame) return;
                frame = requestAnimationFrame(() => {
                    frame = 0;
                    settle();
                });
            }, { passive: true });

            function busy() {
                return !!document.querySelector(".modal:not(.hidden)");
            }

            const KEYS = {
                ArrowDown: 1, PageDown: 1, " ": 1,
                ArrowUp: -1, PageUp: -1
            };

            document.addEventListener("keydown", (e) => {
                if (busy() || e.metaKey || e.ctrlKey || e.altKey) return;
                const el = e.target instanceof Element ? e.target : null;
                if (el && el.closest("input, textarea, select")) return;
                // Space belongs to whatever is focused before it belongs to us.
                if (e.key === " " && el && el.closest("button, a, summary")) return;
                if (e.key === "Home") { go(0); e.preventDefault(); return; }
                if (e.key === "End") { go(pages.length - 1); e.preventDefault(); return; }
                const step = KEYS[e.key];
                if (!step) return;
                e.preventDefault();
                go(page + step);
            });

            let resizeTimer = 0;
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (wantedPerPage() === perPage) {
                        // A snapped scroller usually holds its place across a
                        // resize on its own, but not every browser does.
                        go(page, true);
                        return;
                    }
                    build(page * perPage);
                }, 120);
            });

            document.body.classList.add("deck-ready");
            build(0);
        })();
    </script>
