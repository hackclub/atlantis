{% load static %}
{% comment %}
The desk, the shelf and a book's cover. Shared by a person's own projects and
the explore shelf, so the two never drift apart. Whatever else sits on a cover
belongs to the page including this.
{% endcomment %}
    <style>
        @font-face {
            font-family: "Atlantis Hand";
            src: url("{% static 'atlantis_site/assets/fonts/atlantishand.ttf' %}") format("truetype");
        }

        :root {
            --deck-gap: clamp(20px, 3vw, 64px);
            --deck-pad: clamp(18px, 3vw, 52px);
        }

        body {
            margin: 0;
            /* The shelf sits on a sheet of paper over dark wood. The fallback
               colour is the wood, so the ragged paper edge never opens onto
               white on aspect ratios the art does not cover. */
            background-color: #4A2E17;
            background-image: url("{% static 'atlantis_site/assets/img/projects/background.png' %}");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #1D1D1F;
            font-family: "Atlantis Hand", sans-serif;
        }

        .sheet {
            box-sizing: border-box;
            max-width: 1560px;
            margin: 0 auto;
            padding: clamp(16px, 2.2vw, 34px) var(--deck-pad) clamp(40px, 6vw, 96px);
        }

        /* The deck takes over once its script has grouped the books into
           pages; until then the shelf is a plain scrolling grid. */
        body.deck-ready {
            overflow: hidden;
        }

        body.deck-ready .sheet {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding-bottom: clamp(26px, 3vw, 46px);
        }

        .topbar {
            box-sizing: border-box;
            display: flex;
            align-items: baseline;
            gap: clamp(10px, 1.2vw, 20px);
            /* Breaks out of .sheet's centered max-width so the back link
               hugs the viewport's real corner instead of drifting inward,
               stranded over open wood, once the sheet is capped on wide
               screens. */
            width: 100vw;
            margin-left: calc(50% - 50vw);
            padding-left: var(--deck-pad);
        }

        /* Sits in the corner, which the background leaves as bare wood, so it
           is cream with a shadow rather than the paper's brown ink. */
        #back-link {
            color: #E9D8B4;
            text-decoration: none;
            font-size: clamp(18px, 1.6vw, 28px);
            text-shadow: 0 1px 3px rgba(24, 13, 4, 0.55);
        }

        #back-link:hover,
        #back-link:focus-visible {
            color: #FFF6E2;
        }

        #empty-note {
            margin: clamp(12px, 1.4vw, 22px) 0 0;
            color: #7B6640;
            font-size: clamp(18px, 1.5vw, 26px);
        }

        #shelf {
            /* How many books stand on one shelf. The deck script reads this
               back so the grouping and the sizing can never disagree. */
            --per-page: 3;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
            gap: var(--deck-gap);
            align-items: center;
            justify-items: center;
            margin-top: clamp(18px, 2.5vw, 40px);
        }

        @media (max-width: 1080px) {
            #shelf { --per-page: 2; }
        }

        @media (max-width: 700px) {
            #shelf { --per-page: 1; }
        }

        .book,
        .add-project {
            width: 100%;
            max-width: 470px;
        }

        /* ---------- the deck: three books at a time ---------- */

        /* Everything above the deck keeps its height; the deck takes what is
           left, however little that is. */
        body.deck-ready .sheet > :not(#deck) {
            flex: 0 0 auto;
        }

        body.deck-ready #deck {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            /* Vertical panning is the deck's to interpret, not the browser's. */
            touch-action: none;
        }

        /* The whole stack of shelves, slid up one deck-height at a time. Its
           own height is the deck's, so a -100% translate is exactly one page. */
        body.deck-ready #shelf {
            display: block;
            position: relative;
            height: 100%;
            margin: 0;
            translate: 0 calc(var(--page, 0) * -100%);
            transition: translate 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .shelf-page {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(var(--i) * 100%);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--deck-gap);
            /* A size container, so the books below can be measured against the
               deck itself rather than against a guess at the window. */
            container-type: size;
        }

        /* Fit by height as well as width, so a whole row always lands inside
           the deck instead of being clipped by it. 0.6664 is the book art's
           765 / 1148, turning the height budget into a width. */
        .shelf-page > .book,
        .shelf-page > .add-project {
            flex: 0 0 auto;
            width: min(
                470px,
                calc(96cqh * 0.6664),
                calc((100cqw - (var(--per-page) - 1) * var(--deck-gap)) / var(--per-page))
            );
            max-width: none;
        }

        @media (prefers-reduced-motion: reduce) {
            body.deck-ready #shelf {
                transition-duration: 1ms;
            }
        }

        /* One dot per shelf: the only remaining cue that there is more below,
           now that the scrollbar is gone. */
        .deck-dots {
            display: none;
            position: fixed;
            right: clamp(6px, 1.2vw, 18px);
            top: 50%;
            translate: 0 -50%;
            z-index: 10;
            flex-direction: column;
            gap: 11px;
            padding: 11px 9px;
            border-radius: 999px;
            /* The background is bare wood at the edges and paper in the
               middle, so the chip carries the contrast, not the dots. */
            background-color: rgba(28, 16, 4, 0.34);
        }

        body.deck-paged .deck-dots {
            display: flex;
        }

        .deck-dot {
            width: 11px;
            height: 11px;
            padding: 0;
            border: 2px solid rgba(246, 231, 200, 0.6);
            border-radius: 999px;
            background: none;
            cursor: pointer;
            transition: background-color 0.2s ease-out, border-color 0.2s ease-out, scale 0.2s ease-out;
        }

        .deck-dot:hover,
        .deck-dot:focus-visible {
            border-color: #FBEFD6;
        }

        .deck-dot[aria-current="true"] {
            border-color: #FBEFD6;
            background-color: #FBEFD6;
            scale: 1.2;
        }

        /* Past a dozen shelves a dot column would run off a phone, so the
           chip carries the count instead. */
        body.deck-counted .deck-dots {
            padding: 0.15em 0.6em 0.25em;
            border-radius: 999px;
        }

        .deck-count {
            margin: 0;
            color: #F6E7C8;
            font-size: clamp(15px, 1.2vw, 20px);
            line-height: 1.3;
            white-space: nowrap;
        }

        .deck-hint {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 0;
            translate: -50% 0;
            z-index: 5;
            padding: 0.1em 0.5em 0.2em;
            border-radius: 999px;
            background-color: rgba(28, 16, 4, 0.34);
            color: #F6E7C8;
            font-size: clamp(17px, 1.4vw, 24px);
            line-height: 1.2;
            pointer-events: none;
            animation: deck-nudge 1.9s ease-in-out infinite;
        }

        body.deck-paged .deck-hint {
            display: block;
        }

        body.deck-end .deck-hint {
            display: none;
        }

        @keyframes deck-nudge {
            0%, 100% { translate: -50% 0; }
            50% { translate: -50% 5px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .deck-hint { animation: none; }
        }

        .book {
            position: relative;
            container-type: inline-size;
            transition: scale 0.15s ease-out, filter 0.15s ease-out;
        }

        /* The scale lives on .book, not on .book-face: a transform there would
           trap the cover in its own stacking context and bury the screenshot
           button under the link overlay. */
        .book:has(.book-link:hover),
        .book:has(.book-link:focus-visible) {
            scale: 1.025;
            filter: brightness(1.06);
        }

        .book-face {
            position: relative;
            aspect-ratio: 765 / 1148;
            overflow: hidden;
        }

        /* Covers the whole book so anywhere but the controls opens the project. */
        .book-link {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* book.png is a small book on a big transparent canvas — pull the cover
           out of it the way the dashboard crops its dock items. */
        .book-art {
            position: absolute;
            left: -80.131%;
            top: -7.666%;
            width: 326.797%;
            height: auto;
            pointer-events: none;
            filter: drop-shadow(0 0.5cqw 1.2cqw rgba(58, 36, 12, 0.28));
        }

        .book-content {
            position: absolute;
            left: 17%;
            right: 8%;
            top: 10%;
            bottom: 15%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .book-photo {
            box-sizing: border-box;
            align-self: flex-start;
            width: 86%;
            margin-bottom: 7%;
            padding: 4% 4% 6%;
            background-color: #FFFFFF;
            rotate: -2.5deg;
            box-shadow: 0 0.6cqw 1.6cqw rgba(30, 18, 4, 0.45);
        }

        .book-photo img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background-color: #E7E1D3;
        }

        /* Same slot as .book-photo, so a book keeps its shape before the
           screenshot lands. Raised above .book-link so it stays clickable. */
        .book-photo-empty {
            position: relative;
            z-index: 2;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: flex-start;
            width: 86%;
            aspect-ratio: 4 / 3;
            margin-bottom: 7%;
            padding: 6%;
            border: 0.6cqw dashed rgba(248, 234, 205, 0.5);
            border-radius: 1.4cqw;
            background: none;
            font: inherit;
            font-size: 15px;
            font-size: 5cqw;
            line-height: 1.3;
            color: rgba(248, 234, 205, 0.72);
            text-align: center;
            transition: border-color 0.15s ease-out, color 0.15s ease-out;
        }

        button.book-photo-empty {
            cursor: pointer;
        }

        button.book-photo-empty:hover,
        button.book-photo-empty:focus-visible {
            border-color: rgba(248, 234, 205, 0.9);
            color: #FBEFD6;
        }

        .book-title {
            margin: 0;
            font-weight: 400;
            font-size: 26px;
            font-size: 9cqw;
            line-height: 1.1;
            /* The clamp crops at the padding edge, so without this the tails of
               g/j/p/y on the last line get sliced off. */
            padding-bottom: 0.18em;
            color: #FBEFD6;
            overflow-wrap: anywhere;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-meta {
            display: flex;
            align-items: baseline;
            gap: 6%;
            margin: 1% 0 0;
            font-size: 18px;
            font-size: 6cqw;
            line-height: 1.2;
            color: #F1E2C2;
        }

        /* Each editor gets its own brand colour, same palette as the chips in
           css/labels.css — lightened where the chip colour was mixed for white
           text on a white page and would sink into the cover here. */
        .book-editor {
            color: #E8D7B4;
            white-space: nowrap;
        }

        .editor-fusion-360 { color: #FF6B01; }
        .editor-onshape { color: #64BB58; }
        .editor-solidworks { color: #E7746B; }
        .editor-freecad { color: #DD7A80; }

        .book-desc {
            margin: 7% 0 0;
            font-size: 15px;
            font-size: 5.2cqw;
            line-height: 1.35;
            padding-bottom: 0.12em;
            color: rgba(248, 234, 205, 0.62);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
